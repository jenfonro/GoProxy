name: Beta

run-name: Beta #${{ github.run_number }}

on:
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BETA_TAG: beta
  BETA_BUILD_VERSION: v0.0.0-beta.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  prepare_beta:
    name: prepare-beta
    runs-on: ubuntu-latest
    steps:
      - name: Update moving beta tag & delete old beta release
        uses: actions/github-script@v7
        env:
          BETA_TAG: ${{ env.BETA_TAG }}
        with:
          script: |
            const tag = process.env.BETA_TAG || 'beta'
            const owner = context.repo.owner
            const repo = context.repo.repo

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })
              await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true })
            } catch (e) {
              if (e.status !== 404) throw e
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha })
            }

            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id })
            } catch (e) {
              if (e.status !== 404) throw e
            }

      - name: Ensure beta release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: ${{ env.BETA_TAG }}
          prerelease: true
          body: "Preparing beta assets..."

  build:
    name: build-${{ matrix.asset_os }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: prepare_beta
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_os: linux
          - goos: linux
            goarch: arm64
            asset_os: linux
          - goos: linux
            goarch: amd64
            asset_os: linux-musl
          - goos: linux
            goarch: arm64
            asset_os: linux-musl
          - goos: windows
            goarch: amd64
            asset_os: windows
          - goos: windows
            goarch: arm64
            asset_os: windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute commit metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "GOPROXY_COMMIT=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_ENV}"

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_OS: ${{ matrix.asset_os }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          out="dist/goproxy_${ASSET_OS}_${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w -X main.BuildCommit=${{ env.GOPROXY_COMMIT }}" -o "${out}" .
          echo "built: ${out}"

      - name: Upload asset to beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          files: dist/goproxy_${{ matrix.asset_os }}_${{ matrix.goarch }}*
          overwrite_files: true
          prerelease: true

  release:
    name: release-beta
    runs-on: ubuntu-latest
    needs: [prepare_beta, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes (since latest stable tag)
        shell: bash
        run: |
          set -euo pipefail

          base_tag="$(
            git tag --merged HEAD --list 'v*' \
              | grep -Ev '(^$|beta|timestamp)' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          {
            echo "beta build: ${{ env.BETA_BUILD_VERSION }}"
            echo "commit: ${{ github.sha }}"
            echo
            if [[ -n "${base_tag}" ]]; then
              echo "base: ${base_tag} ($(git rev-parse "${base_tag}"))"
              echo "commits since ${base_tag}: $(git rev-list --count "${base_tag}..HEAD")"
              echo
              git log --oneline "${base_tag}..HEAD"
            else
              echo "base: (no stable v* tag found on this branch)"
              echo
              git log --oneline -n 50
            fi
          } > notes.md

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: ${{ env.BETA_TAG }}
          prerelease: true
          body_path: notes.md
